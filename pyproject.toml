[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradguide"
version = "0.1.0"
description = "RAG advising assistant for graduate students"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
ui = ["streamlit>=1.32"]
pdf = ["pypdf>=4.0"]
tokens = ["tiktoken>=0.6"]
rerank = ["sentence-transformers>=2.6"]
dev = ["pytest>=8", "httpx>=0.27", "ruff"]
all = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.32", "pypdf>=4.0", "tiktoken>=0.6"]

[project.scripts]
gradguide = "gradguide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gradguide = ["generate/templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
